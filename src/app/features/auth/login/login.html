<div class="container-fluid vh-100 d-flex align-items-center justify-content-center login-wrapper">
  <div class="row shadow-lg rounded-4 overflow-hidden login-card">

    
    <div class="col-md-6 left-section d-none d-md-flex flex-column justify-content-center align-items-start p-5 text-white">
      <h2 class="fw-bold">Hi there,<br> great to see you</h2>
      <p class="mt-3 opacity-75">Manage attendance, tasks & collaboration in one place.</p>
    </div>

    
    <div class="col-md-6 bg-white p-5">

      <h2 class="fw-bold text-success mb-2">Welcome back!</h2>
      <p class="text-muted mb-4">Enter your credentials to continue</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        
        <div class="mb-3 input-group border rounded">
          <span class="input-group-text bg-light">
            <i class="bi bi-envelope-fill"></i>
          </span>
          <input type="email"
                 class="form-control border-0 shadow-none"
                 placeholder="Email"
                 formControlName="email">
        </div>

        
        <div class="mb-3 input-group border rounded">
          <span class="input-group-text bg-light">
            <i class="bi bi-lock-fill"></i>
          </span>
          <input 
            [type]="showPassword ? 'text' : 'password'"
            class="form-control border-0 shadow-none"
            placeholder="Password"
            formControlName="password">

            <span class="input-group-text bg-light cursor-pointer" (click)="togglePassword()">
                <li class="bi"
                    [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'">
                </li>
            </span>
        </div>

        
        <div class="form-check mb-3">
          <input class="form-check-input tick" type="checkbox" id="remember">
          <label class="form-check-label text-muted" for="remember">
            Remember me
          </label>
        </div> 

        
        <button type="submit" class="w-100 py-2 rounded-pill login-btn">
          Log In
        </button>

        <div *ngIf="showError" class="alert alert-danger mt-3 text-center small">
            {{ errorMessage }}
        </div>

      </form>

    </div>
  </div>
</div>
