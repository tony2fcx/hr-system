<div class="dashboard-layout">
  
  <aside class="sidebar">

    <button class="menu-btn text-white" (click)="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>

    <h4 class="logo">
      <i class="bi bi-speedometer2 me-2"></i> HR Panel
    </h4>

    <ul class="nav flex-column mt-4">

      <li class="nav-item">
        <a routerLink="/dashboard/hr" routerLinkActive="active"
          [routerLinkActiveOptions]="{exact:true}" class="nav-link">
          <i class="bi bi-house-door"></i>
          Dashboard
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/auth/managers" routerLinkActive="active" class="nav-link">
          <i class="bi bi-person-plus"></i>
          Managers
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/auth/employees" routerLinkActive="active" class="nav-link">
          <i class="bi bi-person-add"></i>
          Employees
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/auth/register" routerLinkActive="active" class="nav-link">
          <i class="bi bi-people"></i>
          Profile Creation
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/auth/assign-employees" routerLinkActive="active" class="nav-link">
          <i class="bi bi-person-gear"></i>
          Team Creation
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/attendance/hr/all" routerLinkActive="active" class="nav-link">
          <i class="bi bi-receipt-cutoff"></i>
          Attendance
        </a>
      </li>

    </ul>

  </aside>


  
  <div class="main-wrapper">

    
    <nav class="navbar">

      <button class="menu-btn" (click)="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>

      <span class="fw-bold text-success fs-5">
        Welcome HR
      </span>

      <div class="nav-right">

        <img
          *ngIf="profile()"
          [src]="'http://127.0.0.1:8000/' + profile().profile_image"
          class="profile-img"
          routerLink="/hr/profile"
        />

        <i *ngIf="!profile()" class="bi bi-person-circle default-user"></i>

        <button class="btn btn-danger btn-sm" (click)="logout()">
          Logout
        </button>

      </div>

    </nav>


    
    <div class="content-area">

      
      <div class="row g-4">

        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card dashboard-card text-center">
            <i class="bi bi-people fs-2 text-primary"></i>
            <h6>Total Staff</h6>
            <h4>{{ employees().length + managers().length }}</h4>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card dashboard-card text-center bg-warning text-white">
            <i class="bi bi-person-badge fs-2"></i>
            <h6>Managers</h6>
            <h4>{{ managers().length }}</h4>
          </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card dashboard-card text-center bg-primary text-white">
            <i class="bi bi-person fs-2"></i>
            <h6>Employees</h6>
            <h4>{{ employees().length }}</h4>
          </div>
        </div>

      </div>


      
      <div class="row g-4 mt-3">

        <div class="col-12 col-lg-6">
          <div class="card dashboard-card">
            <h6 class="chart-title">
              <i class="bi bi-bar-chart-line"></i>
              Staff Distribution
            </h6>

            <div class="chart-box">
              <canvas id="staffChart"></canvas>
            </div>
          </div>
        </div>


        <div class="col-12 col-lg-6">
          <div class="card dashboard-card">
            <h6 class="chart-title">
              <i class="bi bi-graph-up-arrow"></i>
              Attendance Overview
            </h6>

            <div class="chart-box">
              <canvas id="attendanceChart"></canvas>
            </div>
          </div>
        </div>

      </div>

    </div>

  </div>

</div>
