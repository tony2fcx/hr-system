<div class="dashboard-layout">

  <aside class="sidebar" [class.open]="sidebarOpen">

    <button class="menu-btn" (click)="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>

    <h4 class="logo">
      <i class="bi bi-speedometer2 me-2"></i> HR Panel
    </h4>

    <ul class="nav flex-column mt-4">

      <li class="nav-item">
        <a routerLink="/dashboard/hr" routerLinkActive="active"
        [routerLinkActiveOptions]="{exact:true}" class="nav-link">
          <i class="bi bi-house-door"></i> Dashboard
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/auth/managers" routerLinkActive="active" class="nav-link">
          <i class="bi bi-person-plus"></i> Managers
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/auth/employees" routerLinkActive="active" class="nav-link">
          <i class="bi bi-person-add"></i> Employees
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/auth/register" routerLinkActive="active" class="nav-link">
          <i class="bi bi-people"></i> Profile Creation
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/auth/assign-employees" routerLinkActive="active" class="nav-link">
          <i class="bi bi-person-gear"></i> Team Creation
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/attendance/hr/all" routerLinkActive="active" class="nav-link">
          <i class="bi bi-receipt-cutoff"></i> Attendance
        </a>
      </li>

    </ul>

  </aside>

  <div class="main-section">

  
    <nav class="navbar">

      
      <button class="menu-btn" (click)="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>

      <span class="fw-bold text-success fs-5">
        Welcome HR
      </span>

      <div class="nav-right">

        <img
          *ngIf="profile()"
          [src]="'http://127.0.0.1:8000/' + profile().profile_image"
          class="profile-img-small"
          routerLink="/hr/profile"
        />

        <i *ngIf="!profile()" class="bi bi-person-circle default-user"></i>

        <button class="btn btn-danger btn-sm" (click)="logout()">
          Logout
        </button>

      </div>

    </nav>


    
    <div class="content-area container">

      <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7 col-sm-10">

          <div class="card shadow border-0 rounded-4 p-4">

            <h4 class="fw-bold text-center text-primary mb-4">
              <i class="bi bi-person-circle me-2"></i>
              Update Profile
            </h4>

            
            <div class="text-center mb-4">

              <div class="image-wrapper mx-auto">

                <img
                [src]="imagePreview() || ('http://127.0.0.1:8000/' + profile().profile_image)"
                class="profile-img"/>

                <label class="upload-overlay">
                  <i class="bi bi-camera-fill"></i>
                  <input type="file" hidden (change)="onImageSelected($event)">
                </label>

              </div>

            </div>

            
            <div class="mb-3">
              <label class="form-label fw-semibold">Name</label>
              <input type="text" class="form-control form-control-lg"
              [(ngModel)]="profile().name">
            </div>

            
            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="text" class="form-control form-control-lg"
              [(ngModel)]="profile().email">
            </div>

            
            <div class="mb-4">
              <label class="form-label fw-semibold">Phone</label>
              <input type="text" class="form-control form-control-lg"
              [(ngModel)]="profile().phone">
            </div>

            <button
            class="btn btn-success w-100 btn-lg"
            (click)="updateProfile()"
            [disabled]="loading">

              <span *ngIf="!loading">
                Update Profile
              </span>

              <span *ngIf="loading">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Updating...
              </span>

            </button>

            <div *ngIf="showError" class="alert alert-danger mt-3 text-center">
              {{ errorMessage }}
            </div>

            <div *ngIf="successMessage" class="alert alert-success mt-3 text-center">
              {{ successMessage }}
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
